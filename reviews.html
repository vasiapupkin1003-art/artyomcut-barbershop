<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отзывы — ArtyomCut | Barbershop</title>
    <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#c51f25">
<link rel="apple-touch-icon" href="/images/logo/logo1.jfif">
    <meta name="description" content="Отзывы клиентов ArtyomCut Barbershop в Хихоне. Оставьте свой отзыв о стрижке или бороде.">
<meta property="og:title" content="Отзывы — ArtyomCut Barbershop">
<meta property="og:description" content="Читайте отзывы клиентов и делитесь своим опытом посещения барбершопа.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://artyomcut-barbershopgijon.es/reviews.html">
<meta property="og:image" content="https://artyomcut-barbershopgijon.es/images/logo/logo1.jfif">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* Стили для страницы отзывов */
        .reviews-page {
            padding: 80px 0;
            min-height: calc(100vh - 200px);
        }
        .reviews-heading {
            text-align: center;
            margin-bottom: 40px;
        }
        .reviews-heading h1 {
            font-size: 36px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 2px;
        }
        .reviews-heading h1 span {
            color: #c51f25;
        }
        .review-form {
            background: #111516;
            border: 1px solid #292d2e;
            border-radius: 10px;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto 40px;
        }
        .review-form h3 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 22px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #aaa6a0;
            font-size: 12px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            background: #0a0c0d;
            border: 1px solid #343839;
            border-radius: 5px;
            padding: 12px 15px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }
        .form-group input[type="text"]:focus,
        .form-group textarea:focus {
            border-color: #c51f25;
        }
        .form-group textarea {
            height: 120px;
            resize: vertical;
        }
        .rating-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .rating-stars {
            display: flex;
            gap: 5px;
            font-size: 30px;
            cursor: pointer;
        }
        .rating-stars .star {
            color: #555;
            transition: color 0.2s;
        }
        .rating-stars .star.active {
            color: #f39c12;
        }
        .rating-stars .star:hover {
            color: #f39c12;
        }
        .btn-submit-review {
            width: 100%;
            height: 50px;
            background: #c51f25;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit-review:hover {
            background: #a01820;
        }
        .reviews-list {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .review-item {
            background: #111516;
            border: 1px solid #292d2e;
            border-radius: 10px;
            padding: 20px;
        }
        .review-item .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .review-item .review-name {
            font-weight: 700;
            color: #fff;
            font-size: 18px;
        }
        .review-item .review-stars {
            color: #f39c12;
            font-size: 18px;
        }
        .review-item .review-message {
            color: #aaa6a0;
            line-height: 1.5;
            margin-bottom: 10px;
        }
        .review-item .review-date {
            color: #666;
            font-size: 12px;
            text-align: right;
        }
        .no-reviews {
            text-align: center;
            color: #aaa6a0;
            font-size: 18px;
            padding: 30px;
        }
        @media (max-width: 768px) {
            .reviews-page {
                padding: 40px 0;
            }
            .reviews-heading h1 {
                font-size: 28px;
            }
            .rating-stars {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- ШАПКА -->
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <img src="images/logo/logo.png" alt="ArtyomCut Barbershop">
            </a>

            <button class="burger-btn" id="burgerBtn" onclick="toggleMobileMenu()">
                <span></span>
                <span></span>

                <a href="index.html#master" data-i18n="nav_master">МАСТЕР</a>
                <a href="gallery.html" data-i18n="nav_gallery">ГАЛЕРЕЯ</a>
                <a href="reviews.html" class="active" data-i18n="nav_reviews">ОТЗЫВЫ</a>
                <a href="index.html#music" data-i18n="nav_music">МУЗЫКА</a>
                <a href="index.html#booking" data-i18n="nav_booking">ЗАПИСЬ</a>

            </nav>

            <div class="socials">

                    <select class="lang-select" onchange="applyLanguage(this.value)">
                        <option value="ru">RU</option>
                        <option value="uk">UA</option>
                        <option value="es">ES</option>
                        <option value="en">EN</option>
                    </select>
                </div>
                <a href="https://www.instagram.com/artembarbercat/" target="_blank" class="social-link">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                </a>
                <a href="https://t.me/artyomcut" target="_blank" class="social-link">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 000 12a12 12 0 0012 12 12 12 0 0012-12A12 12 0 0012 0a12 12 0 00-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 01.171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                </a>
            </div>
        </div>
    </header>

    <!-- ОТЗЫВЫ -->
    <section class="reviews-page">
        <div class="container">
            <div class="reviews-heading">
                <h1><span data-i18n="reviews_heading_1">ОТЗЫВЫ</span> <span data-i18n="reviews_heading_2">КЛИЕНТОВ</span></h1>
                <div class="section-line"></div>
            </div>

            <!-- Форма добавления отзыва -->
            <div class="review-form">
                <h3 data-i18n="reviews_form_heading">ОСТАВИТЬ ОТЗЫВ</h3>
                <div class="form-group">
                    <label data-i18n="review_name_label">ВАШЕ ИМЯ</label>
                    <input type="text" id="reviewName" data-i18n-placeholder="review_name_placeholder" placeholder="Как вас зовут?">
                </div>
                <div class="form-group">
                    <label data-i18n="review_rating_label">ВАША ОЦЕНКА</label>
                    <div class="rating-group">
                        <div class="rating-stars" id="ratingStars">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                        <span id="ratingValue" style="color: #fff; font-size: 18px;">0/5</span>
                    </div>
                </div>
                <div class="form-group">
                    <label data-i18n="review_message_label">ВАШЕ СООБЩЕНИЕ</label>
                    <textarea id="reviewMessage" data-i18n-placeholder="review_message_placeholder" placeholder="Напишите пару слов о визите..."></textarea>
                </div>
                <button class="btn-submit-review" onclick="submitReview()" data-i18n="review_submit">ОТПРАВИТЬ ОТЗЫВ</button>
            </div>

            <!-- Список отзывов -->
            <div class="reviews-list" id="reviewsList">
                <!-- Отзывы будут добавлены через JS -->
            </div>
        </div>
    </section>

    <!-- ПОДВАЛ -->
    <footer class="footer">
        <div class="container">
            <p data-i18n="footer_copyright">© 2026 ArtyomCut Barbershop — Gijón</p>
            <p data-i18n="footer_slogan">ROCK & CUTS ⚡ SINCE 2021</p>
            <a href="admin.html" class="admin-link" aria-label="Админ-панель">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15.5A3.5 3.5 0 100 12a3.5 3.5 0 000 7zM19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1.04 1.56V21a2 2 0 01-4 0v-.09A1.7 1.7 0 008.9 19.4a1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.7 1.7 0 004.6 15a1.7 1.7 0 00-1.56-1.04H3a2 2 0 010-4h.09A1.7 1.7 0 004.6 8.9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 012.83-2.83l.06.06A1.7 1.7 0 008.9 4.6a1.7 1.7 0 001.04-1.56V3a2 2 0 014 0v.09a1.7 1.7 0 001.04 1.56 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 012.83 2.83l-.06.06A1.7 1.7 0 0019.4 8.9a1.7 1.7 0 001.56 1.04H21a2 2 0 010 4h-.09a1.7 1.7 0 00-1.56 1.04z"/></svg>
            </a>
        </div>
    </footer>

    <script src="reviews.js"></script>
    <script src="translations.js"></script>
    <script src="i18n.js"></script>
    <script>
        <script>
    function toggleMobileMenu() {
        const nav = document.getElementById('mobileNav');
        if (nav) {
            nav.classList.toggle('open');
            document.body.style.overflow = nav.classList.contains('open') ? 'hidden' : '';
        }
    }
    document.addEventListener('click', function(e) {
        const nav = document.getElementById('mobileNav');
        const burger = document.getElementById('burgerBtn');
        if (nav && nav.classList.contains('open') && !nav.contains(e.target) && !burger.contains(e.target)) {
            nav.classList.remove('open');
            document.body.style.overflow = '';
        }
    });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
</script>
</body>
</html>
