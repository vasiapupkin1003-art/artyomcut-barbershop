    <style>
        .reviews-page { padding: 80px 0; min-height: calc(100vh - 200px); }
        .reviews-heading { text-align: center; margin-bottom: 40px; }
        .reviews-heading h1 { font-size: 36px; font-weight: 900; color: #fff; letter-spacing: 2px; }
        .reviews-heading h1 span { color: #c51f25; }
        .review-form { background: #111516; border: 1px solid #292d2e; border-radius: 10px; padding: 30px; max-width: 600px; margin: 0 auto 40px; }
        .review-form h3 { color: #fff; margin-bottom: 20px; font-size: 22px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #aaa6a0; font-size: 12px; margin-bottom: 8px; letter-spacing: 1px; }
        .form-group input[type="text"], .form-group textarea { width: 100%; background: #0a0c0d; border: 1px solid #343839; border-radius: 5px; padding: 12px 15px; color: #fff; font-size: 16px; outline: none; transition: border 0.3s; }
        .form-group input[type="text"]:focus, .form-group textarea:focus { border-color: #c51f25; }
        .form-group textarea { height: 120px; resize: vertical; }
        .rating-group { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .rating-stars { display: flex; gap: 5px; font-size: 30px; cursor: pointer; }
        .rating-stars .star { color: #555; transition: color 0.2s; }
        .rating-stars .star.active { color: #f39c12; }
        .rating-stars .star:hover { color: #f39c12; }
        .btn-submit-review { width: 100%; height: 50px; background: #c51f25; color: #fff; border: none; border-radius: 5px; font-size: 16px; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: background 0.3s; }
        .btn-submit-review:hover { background: #a01820; }
        .reviews-list { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .review-item { background: #111516; border: 1px solid #292d2e; border-radius: 10px; padding: 20px; }
        .review-item .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .review-item .review-name { font-weight: 700; color: #fff; font-size: 18px; }
        .review-item .review-stars { color: #f39c12; font-size: 18px; }
        .review-item .review-message { color: #aaa6a0; line-height: 1.5; margin-bottom: 10px; }
        .review-item .review-date { color: #666; font-size: 12px; text-align: right; }
        .no-reviews { text-align: center; color: #aaa6a0; font-size: 18px; padding: 30px; }
        @media (max-width: 768px) {
            .reviews-page { padding: 40px 0; }
            .reviews-heading h1 { font-size: 28px; }
            .rating-stars { font-size: 24px; }
        }
    </style>

    <script>
        function toggleMobileMenu() {
            const nav = document.getElementById('mobileNav');
            if (nav) {
                nav.classList.toggle('open');
                document.body.style.overflow = nav.classList.contains('open') ? 'hidden' : '';
            }
        }
        document.addEventListener('click', function(e) {
            const nav = document.getElementById('mobileNav');
            const burger = document.getElementById('burgerBtn');
            if (nav && nav.classList.contains('open') && !nav.contains(e.target) && !burger.contains(e.target)) {
                nav.classList.remove('open');
                document.body.style.overflow = '';
            }
        });
    </script>
